# The console's weekly Tier 2 run: one scheduled job calling `pnpm test:t2`, on master's current commit.
#
# Tier 2 is the `*.perf.test.*` convention, the timed browser suite and the affected Tier 1 tests. There is no
# `*.perf.test.*` file here yet, so on a clean master the run selects the whole Tier 1 set (no last-green marker and no
# diff) and runs the timed browser suite. The 20-sample navigation protocol is a diagnostic now, not a tier and not a
# CI job: run `node scripts/perf.ts --routes <route>` on a quiet machine when a change needs it.
#
# The release standard is not run here: `gate.yml` runs `test:release` on every push, and evidence on a commit stands
# for it. A dispatch names the jobs it runs: `gh workflow run weekly.yml -f jobs=t2`.
#
# Every page reads the fake gateway (`fakeApi` in scripts/verify.config.ts): nothing here holds a credential or reaches
# the deployment.
name: weekly

on:
  schedule:
    - cron: '41 4 * * 1'   # Mondays, 04:41 UTC
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run, comma-separated without spaces: t2'
        type: string
        default: t2

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  # A dispatch's list, read before any job starts: a name that is not a job, or a space after a comma, would otherwise
  # skip that job silently, and a list naming none would end green having run nothing.
  named:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every name is a job
        env:
          JOBS: ${{ inputs.jobs || 't2' }}
        run: |
          set -euo pipefail
          IFS=',' read -ra names <<< "$JOBS"
          [ "${#names[@]}" -gt 0 ] || { echo "jobs names no job: give t2"; exit 1; }
          for n in "${names[@]}"; do
            case "$n" in
              t2) ;;
              *) echo "jobs: '$n' is not a job; name t2, comma-separated without spaces"; exit 1 ;;
            esac
          done

  t2:
    needs: named
    if: contains(format(',{0},', inputs.jobs || 't2'), ',t2,')
    runs-on: ubuntu-24.04
    # The whole Tier 1 set plus the timed browser suite: navigation budgets, live data, the product's timed checks and
    # Web Vitals. The old timed job allowed 90 minutes.
    timeout-minutes: 90
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # corepack reads `packageManager` from package.json, so the runner uses the pinned pnpm.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: test:t2
        run: pnpm test:t2
