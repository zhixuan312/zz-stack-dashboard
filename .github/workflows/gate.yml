# The console's gate, on every push to master.
#
# The console is its own repository with its own suite, and zz-stack's gate cannot see it. That
# separation is real — a wording change here is not a platform release — but it meant the only thing
# that ran this suite was `node scripts/release.ts` in the other repository, at the moment a release
# could least afford a surprise. 0.83.1's console gate failed inside a release and passed on every
# manual run; with the suite's output swallowed by the release script there was no way to tell a
# broken build from a killed one.
#
# `pnpm`, because this repository declares `packageManager: pnpm@10.33.0` and carries a pnpm
# lockfile. `verify` builds and serves the app and drives a browser, the slowest step here.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# Queued, not cancelled: every push gets a verdict.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # corepack reads `packageManager` from package.json, so the runner uses the pinned pnpm
      # rather than whatever the image happens to carry.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # Meridian's SHALLOW depth, which is what this command has always run: the gate (tokens,
      # specifications, contrast, types, tests), a production build against the fake gateway, the
      # route policy and the size checks, and a three-route navigation smoke -- about 40 s.
      #
      # DELIBERATE, AND TEMPORARY: this comment used to claim the audit of every page at five
      # widths in both themes and every control pressed, which is what `--full` does and what this
      # job has never done. Nobody looked, because the comment said it was covered. Six document
      # routes then sat above the LCP bar unnoticed. `--full` is about 19 minutes and is red until
      # those six are fixed, so the flag changes with that fix, not before it. The browser checks
      # drive the runner's own Chrome; nothing reaches the real deployment.
      - run: pnpm run verify
        env:
          CHROME: /usr/bin/google-chrome

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: out/verify.txt
