# The console's release run, on every push to master: `pnpm test:release`, the one command that runs every Tier 1 and
# Tier 2 test with lint and the type check.
#
# This workflow used to split Meridian's standard across three jobs, each calling a Meridian flag by name. Those flags
# are the suite's internals and several of them ran browsers; the repository now offers three commands, and CI calls
# only them. `test:release` runs the static checks, `next typegen`, `tsc --noEmit`, `eslint .`, every test, and the
# browser standard: the audit, the presses, the keyboard walk, the assistant walk-through and both persona walks at
# Tier 1, then the timed suites at Tier 2. It builds and serves the app against the fake gateway. Without Chrome the
# browser standard is reported not run, never passed; the build, the route policy and the first-load sizes still run,
# and the HTML sizes are reported not run because no build is served.
#
# The console is its own repository with its own suite, and zz-stack's gate cannot see it. That separation is real (a
# wording change here is not a platform release), but it meant the only thing that ran this suite was
# `node scripts/release.ts` in the other repository, at the moment a release could least afford a surprise. 0.83.1's
# console gate failed inside a release and passed on every manual run; with the suite's output swallowed by the release
# script there was no way to tell a broken build from a killed one.
#
# Every page reads the fake gateway (`fakeApi` in scripts/verify.config.ts): nothing here holds a credential or reaches
# the deployment.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled: every push gets a verdict.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # The whole standard on one runner: the static checks, the type check, lint, every test, and the browser standard,
    # which builds and serves the app for the audit, the presses, the keyboard walk, the assistant, both persona walks
    # and the timed suites. The old full and timed jobs each allowed 90 minutes on separate runners; this one runs them
    # one after the other, so it gets their sum and a margin.
    timeout-minutes: 180
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # corepack reads `packageManager` from package.json, so the runner uses the pinned pnpm rather than whatever the
      # image happens to carry.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The only test command this repository offers. It runs its own static checks, type check, lint and build.
      #
      # The step's own log is long — the suites print every expected failure, and a downloaded log was cut off before
      # any of its verdict lines — so the lines that decide the run go to the run's summary as well, where they stay
      # readable however the log is cut: each suite's last line and every failure it named.
      - name: pnpm test:release
        run: |
          set +e
          pnpm test:release 2>&1 | tee /tmp/test-release.log
          status=${PIPESTATUS[0]}
          {
            echo '### test:release'
            echo '```'
            grep -aE '(^| )(FAIL|not run|states:|journeys:|primary data:|test:release:)' /tmp/test-release.log | tail -60
            echo '```'
            echo "exit status: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"
