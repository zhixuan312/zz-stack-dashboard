# The console's gate, on every push to master.
#
# The console is its own repository with its own suite, and zz-stack's gate cannot see it. That
# separation is real — a wording change here is not a platform release — but it meant the only thing
# that ran this suite was `node scripts/release.ts` in the other repository, at the moment a release
# could least afford a surprise. 0.83.1's console gate failed inside a release and passed on every
# manual run; with the suite's output swallowed by the release script there was no way to tell a
# broken build from a killed one.
#
# `pnpm`, because this repository declares `packageManager: pnpm@10.33.0` and carries a pnpm
# lockfile. `verify` builds and serves the app and drives a browser, the slowest step here.
name: gate

on:
  push:
    branches: [master]
  workflow_dispatch:

# Queued, not cancelled: every push gets a verdict.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # Sized for the audit and the presses, which drive a browser for about 22 minutes on ten fast cores. A
    # runner has fewer and slower ones, and a job killed at the ceiling reports nothing about the tree.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # corepack reads `packageManager` from package.json, so the runner uses the pinned pnpm
      # rather than whatever the image happens to carry.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # The WHOLE standard: the gate (tokens, specifications, contrast, types, tests), a production build
      # against the fake gateway, the route policy and the size checks, the audit of every page at five
      # widths in both themes, every control pressed and every link followed, the whole keyboard path, the
      # product's own browser checks, and Web Vitals on a mid-range phone. About 22 minutes here; longer on
      # a runner, which is what the timeout above is for.
      #
      # DELIBERATE, and this is the part worth knowing: this job ran `pnpm verify` with NO FLAG for its whole
      # life, which is the shallow depth — the gate, one build, the route policy, the size checks and a
      # three-route navigation smoke, about a minute. Its own comment described the deep run, so nobody looked,
      # and six document routes sat above the LCP bar for a day of work before anything said so. Only running
      # the real thing by hand ever did. The flag is `--full` from 0.26.1, which is the release that brought
      # those six under the bar. `out/verify.txt` names every suite that did not run; a check that did not run
      # reads exactly like one that passed.
      - run: pnpm run verify --full
        env:
          CHROME: /usr/bin/google-chrome

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: out/verify.txt
