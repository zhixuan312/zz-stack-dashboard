# The console, deployed beside zz-stack — never inside its compose file.
#
# DELIBERATE: separate from zz-stack's compose, whose image tags are literals its release builds
# and verifies; folding the console in would make every console change a platform release.
# zz-stack's `scripts/release.ts` still releases the console as its own component, with its own
# version and image. This file is the only thing that goes to the host: the release copies it
# there and pulls the image it names.
#
# The version is a literal, so a host that receives this file needs nothing else typed.
# COUPLED: the release bumps it together with package.json, and zz-stack's gate holds the two.
#
# DELIBERATE: bound to loopback. Caddy on the host is the only way in: it terminates TLS and
# sends /auth/*, /oauth/* and /api/console/* to the gateway and everything else here. Published
# on 0.0.0.0 it would be a second unauthenticated door onto the box.
services:
  console:
    image: ghcr.io/zhixuan312/zz-stack-dashboard:${ZZ_DASHBOARD_VERSION:-0.18.0}
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    # No environment: the app resolves its API against the page's own origin.
