# The console, deployed beside zz-stack — never inside its compose file.
#
# DELIBERATE: separate from zz-stack's compose, whose image tags are literals its release builds
# and verifies; folding the console in would make every console change a platform release.
# zz-stack's `scripts/release.ts` still releases the console as its own component, with its own
# version and image. This file is the only thing that goes to the host: the release copies it
# there and pulls the image it names.
#
# The version is a literal, so a host that receives this file needs nothing else typed.
# COUPLED: the release bumps it together with package.json, and zz-stack's gate holds the two.
#
# DELIBERATE: bound to loopback. Caddy on the host is the only way in: it terminates TLS and
# sends /auth/*, /oauth/* and /api/console/* to the gateway and everything else here. Published
# on 0.0.0.0 it would be a second unauthenticated door onto the box.
services:
  console:
    image: ghcr.io/zhixuan312/zz-stack-dashboard:${ZZ_DASHBOARD_VERSION:-0.28.2}
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    # Every page needs ZZ_GATEWAY: before a page renders, this app's server asks the gateway who is calling (`/me`),
    # sending the caller's own session cookie and storing nothing. It is required here, so compose refuses to start a
    # console that has none: a console without it would open no page, each one saying it cannot reach the platform.
    # ZZ_GATEWAY on this host is the gateway's public address (the api. host in zz-stack's Caddyfile): the gateway is
    # published on the host's loopback, which a container on its own bridge network cannot reach.
    #
    # The assistant is off unless the host sets the provider, the key and the model, plus ASSISTANT_BASE_URL for
    # openai-compatible. Each passes through from the host's own .env beside this file and defaults to empty, which the
    # app reads as unset. No value is written in this file, and the key is never in the image.
    environment:
      - ASSISTANT_PROVIDER=${ASSISTANT_PROVIDER:-}
      - ASSISTANT_API_KEY=${ASSISTANT_API_KEY:-}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-}
      - ASSISTANT_BASE_URL=${ASSISTANT_BASE_URL:-}
      - ZZ_GATEWAY=${ZZ_GATEWAY:?set ZZ_GATEWAY in the .env beside this file to the gateway's public address, https://api.<host>; without it no console page opens}
