# Development override — build from this checkout instead of pulling the published image.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# DELIBERATE: `image:` is not repeated here. What you build lands under the tag the base file
# names, so a later plain `docker compose up -d` runs what you just built.
services:
  console:
    build: .
