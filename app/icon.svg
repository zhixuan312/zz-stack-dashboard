<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ZZ Console">
  <!--
    The product mark, as the tab icon. Same hexagon as AppMark.tsx and the same indigo, so
    the browser tab and the sidebar are recognisably one product.

    FILLED, NOT STROKED. AppMark draws a lucide hexagon outline inside a tinted square, which
    reads correctly at 28px and disappears at 16px — a 2.25px stroke on a 32px canvas is a
    grey smudge in a tab strip. The tab icon keeps the shape and drops the outline treatment,
    which is the usual trade: a favicon is a silhouette, not a small drawing.
  -->
  <rect width="32" height="32" rx="7" fill="#4a5bd0"/>
  <path d="M16 7.2 L23.2 11.4 L23.2 20.6 L16 24.8 L8.8 20.6 L8.8 11.4 Z"
        fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linejoin="round"/>
</svg>
